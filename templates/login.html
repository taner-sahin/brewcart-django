{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <h2 class="mb-4">
            Giriş Yap
        </h2>

        <!-- Kullanıcı giriş formu -->
        <form method="post">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Kullanıcı Adı
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Şifre
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required
                >
            </div>

            <button type="submit" class="btn btn-dark w-100">
                Giriş Yap
            </button>

        </form>

    </div>

</div>

{% endblock %}
