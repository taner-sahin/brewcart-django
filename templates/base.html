{% load static %}

<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />

    <!-- Sayfa Başlığı -->
    <title>BrewCart</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS Dosyası -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <!-- ========================= -->
    <!-- TOP NAVBAR BAŞLANGIÇ -->
    <!-- ========================= -->

    <nav
      class="navbar navbar-expand-lg navbar-dark px-4"
      style="background-color: #5c3d2e"
    >
      <!-- Logo -->
      <a class="navbar-brand fw-bold" href="#"> BrewCart </a>

      <!-- Search Form -->
      <form class="d-flex mx-auto w-50">
        <input
          class="form-control me-2"
          type="search"
          placeholder="Kahve ara..."
        />

        <button class="btn btn-light">Ara</button>
      </form>

      <!-- Sağ Menü -->
      <div>
        {% if user.is_authenticated %}

        <span class="text-white me-2"> {{ user.username }} </span>

        <a href="{% url 'accounts:logout' %}" class="btn btn-light btn-sm">
          Çıkış
        </a>

        {% else %}

        <a
          href="{% url 'accounts:login' %}"
          class="btn btn-outline-light btn-sm"
        >
          Giriş
        </a>

        <a href="{% url 'accounts:register' %}" class="btn btn-light btn-sm">
          Kayıt
        </a>

        {% endif %}

        <a href="#" class="btn btn-outline-light btn-sm"> Sepet </a>
      </div>
    </nav>

    <!-- ========================= -->
    <!-- CATEGORY NAVBAR -->
    <!-- ========================= -->

    <nav
      class="navbar navbar-expand-lg navbar-light px-4"
      style="background-color: #e0c097"
    >
      <div class="navbar-nav">
        {% for category in nav_categories %}
        <a href="{% url 'category_products' category.slug %}" class="nav-link">
          {{ category.name }}
        </a>
        {% endfor %}
      </div>
    </nav>

    <!-- ========================= -->
    <!-- ANA İÇERİK -->
    <!-- ========================= -->

    <div class="container mt-5">{% block content %} {% endblock %}</div>

    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer
      class="text-center mt-5 p-4"
      style="background-color: #2d2424; color: white"
    >
      <p class="mb-0">BrewCart | Backend Focused Django Project</p>
    </footer>
  </body>
</html>
